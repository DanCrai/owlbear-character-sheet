<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Sheet POC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-4 font-sans select-none">

    <!-- No Selection State -->
    <div id="no-token-screen" class="flex flex-col items-center justify-center h-64 text-zinc-400">
        <p class="text-lg">Select a character token to open their sheet.</p>
    </div>

    <!-- Active Sheet Panel -->
    <div id="sheet-screen" class="hidden space-y-6">

        <!-- Header Info -->
        <div class="grid grid-cols-2 gap-3 bg-zinc-800 p-3 rounded-lg border border-zinc-700">
            <div class="col-span-2">
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Character Name</label>
                <input id="char-name" type="text" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 mt-1 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Class</label>
                <input id="char-class" type="text" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 mt-1 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Level</label>
                <input id="char-level" type="number" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 mt-1 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Specialization</label>
                <input id="char-spec" type="text" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 mt-1 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Race</label>
                <input id="char-race" type="text" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 mt-1 focus:outline-none focus:border-purple-500">
            </div>
        </div>

        <!-- Vitals (HP & Mana) -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-red-950/40 border border-red-900/60 p-3 rounded-lg">
                <span class="text-xs font-bold text-red-400 uppercase tracking-wider">Hit Points</span>
                <div class="flex items-center space-x-2 mt-1">
                    <input id="hp-current" type="number" placeholder="Cur" class="w-full text-center bg-zinc-900 border border-zinc-700 rounded py-1">
                    <span class="text-zinc-500">/</span>
                    <input id="hp-total" type="number" placeholder="Max" class="w-full text-center bg-zinc-900 border border-zinc-700 rounded py-1">
                </div>
            </div>
            <div class="bg-blue-950/40 border border-blue-900/60 p-3 rounded-lg">
                <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">Mana</span>
                <div class="flex items-center space-x-2 mt-1">
                    <input id="mana-current" type="number" placeholder="Cur" class="w-full text-center bg-zinc-900 border border-zinc-700 rounded py-1">
                    <span class="text-zinc-500">/</span>
                    <input id="mana-total" type="number" placeholder="Max" class="w-full text-center bg-zinc-900 border border-zinc-700 rounded py-1">
                </div>
            </div>
        </div>

        <!-- Combat Core Stats -->
        <div class="bg-zinc-800 p-4 rounded-lg border border-zinc-700 grid grid-cols-3 gap-3">
            <div>
                <label class="text-xs text-zinc-400 block text-center">AC</label>
                <input id="stat-ac" type="number" class="w-full text-center bg-zinc-900 border border-zinc-600 rounded py-1 mt-1">
            </div>
            <div>
                <label class="text-xs text-zinc-400 block text-center">PA</label>
                <input id="stat-pa" type="number" class="w-full text-center bg-zinc-900 border border-zinc-600 rounded py-1 mt-1">
            </div>
            <div>
                <label class="text-xs text-zinc-400 block text-center">MA</label>
                <input id="stat-ma" type="number" class="w-full text-center bg-zinc-900 border border-zinc-600 rounded py-1 mt-1">
            </div>
            <div>
                <label class="text-xs text-zinc-400 block text-center">MS</label>
                <input id="stat-ms" type="number" class="w-full text-center bg-zinc-900 border border-zinc-600 rounded py-1 mt-1">
            </div>
            <div class="col-span-2">
                <label class="text-xs text-zinc-400 block text-center">Init Bonus</label>
                <input id="stat-init" type="number" class="w-full text-center bg-zinc-900 border border-zinc-600 rounded py-1 mt-1">
            </div>
        </div>

        <!-- Core Attributes Section -->
        <div class="bg-zinc-800 p-3 rounded-lg border border-zinc-700 space-y-2">
            <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Attributes</h3>
            <div class="grid grid-cols-2 gap-x-4 gap-y-2">
                <!-- STR -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">STR</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-str" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-str" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- DEX -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">DEX</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-dex" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-dex" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- CON -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">CON</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-con" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-con" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- INT -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">INT</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-int" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-int" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- WIS -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">WIS</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-wis" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-wis" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- WILL -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60">
                    <label class="text-sm font-semibold text-zinc-300 w-12">WILL</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-will" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-will" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
                <!-- CHA -->
                <div class="flex items-center justify-between bg-zinc-900/50 p-1.5 rounded border border-zinc-700/60 col-span-2 mx-auto w-1/2">
                    <label class="text-sm font-semibold text-zinc-300 w-12">CHA</label>
                    <div class="flex items-center space-x-2">
                        <input id="attr-cha" type="number" class="w-12 text-center bg-zinc-900 border border-zinc-600 rounded py-0.5 text-sm">
                        <span id="mod-cha" class="text-xs font-bold text-purple-400 w-8 text-center bg-purple-950/40 border border-purple-900/40 rounded py-0.5">+0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Abilities List Section -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-zinc-400 uppercase tracking-wider">Abilities</h3>
                <button id="add-ability-btn" class="bg-purple-600 hover:bg-purple-700 text-xs px-2 py-1 rounded font-medium transition">
                    + Add Ability
                </button>
            </div>
            <div id="abilities-container" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                <!-- Dynamic abilities sit here -->
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
